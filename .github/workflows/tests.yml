# Every claim this project makes is checked here, on every push.
#
# Two jobs rather than one, because the two suites fail for unrelated reasons:
# when the badge goes red it should already say whether the engine broke or the
# page did. Neither job needs a service, a database or a secret -- the trained
# model is committed and the front-end tests bring their own server.
name: tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only: nothing here needs to write to the repository.
permissions:
  contents: read

# A branch that gets two pushes a minute apart should test the second one, not
# both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the project declares, and nothing above it yet: 3.14 is the
        # current release and `requires-python` excludes 3.15.
        python: ["3.14"]
    # Job-level, so `uv run` in the later steps resolves the same interpreter
    # `uv sync` built the environment with instead of quietly re-syncing.
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      # Exact version, not a major: setup-uv stopped publishing the moving
      # `vN` tag after v7, so `@v10` does not resolve.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `az` as well as `dev`. The extra pulls a CPU torch wheel, which is not
      # small, but the alternative is worse: coverage counts every file under
      # `src`, so leaving torch out leaves connect4/az/{net,player,train}.py
      # sitting at 0% and drags the total under the 95% gate. Exempting them
      # instead would gate the AlphaZero code at nothing at all.
      - name: Install the project and its dev tools
        run: uv sync --extra dev --extra az --frozen

      # Lint first: it takes a second and it fails for reasons a diff can fix.
      # `ruff check` now includes the `S` (flake8-bandit) rules, so this is the
      # security lint as well; there is no separate Bandit step to add.
      - name: Lint
        run: uv run ruff check .

      # Then types, before the tests. A type error is cheaper to read than a
      # test failure caused by one, and `--strict` over `src/connect4` is what
      # `[tool.mypy]` in pyproject already says -- no flags here, so the check
      # is identical to the one a contributor runs locally.
      - name: Type check
        run: uv run mypy

      # `--cov` alone; the source and the 95% floor live in pyproject so the
      # gate is the same number locally and here. A threshold that only exists
      # in CI is one nobody can reproduce before pushing.
      - name: Test
        run: uv run pytest --cov --cov-report=xml

      # The 95% floor in pyproject is the gate; Codecov is the view -- which
      # lines a pull request stopped covering, annotated on the diff. It cannot
      # be the gate, because a flaky upload would then fail a run whose tests
      # passed, and a badge that goes red for reasons unrelated to the code is
      # a badge people stop reading.
      - name: Upload coverage
        uses: codecov/codecov-action@v7.0.0
        with:
          files: coverage.xml
          fail_ci_if_error: false
          # Tokenless upload works for public repositories but is rate limited;
          # set CODECOV_TOKEN in repository secrets to make it reliable. Absent
          # the secret this still works, just less dependably.
          token: ${{ secrets.CODECOV_TOKEN }}

  web:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The front end has no build step and no dependencies, so the only
        # thing worth proving is that it still runs on the oldest node with a
        # stable `node --test`, as well as on current LTS.
        node: ["20", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Test
        run: node --test web/tests/app.test.js
