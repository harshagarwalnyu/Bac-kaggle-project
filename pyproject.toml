[project]
name = "connect4-glassbox"
version = "0.1.0"
description = "A glass-box Connect 4 bot: a solved bitboard search engine and a from-scratch neural evaluator, side by side."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "numpy>=2.5",
    "scikit-learn>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connect4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
